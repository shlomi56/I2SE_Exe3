[project]
name = "smart-elevator-system"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "benchmark: long-running algorithm benchmark tests",
    "hil: tests requiring real ESP32 hardware (skipped by default)",
]
